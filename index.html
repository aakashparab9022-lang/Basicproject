<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 45px;
            color: #222;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .btn {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Website</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Register</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Welcome to My Website</h1>

        <p>
            Welcome! Login to your account or create a new account.
        </p>

        <div>
            <a href="login.html" class="btn">Login</a>
            <a href="register.html" class="btn">Register</a>
        </div>
    </div>

</body>
</html>
